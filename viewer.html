<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>廣井きくり — デスクトップペット</title>
  <style>
    :root {
      --bg: #12141a;
      --card-bg: #1a1d26;
      --accent: #e0436b;
      --accent-hover: #f05a82;
      --text: #f0f2f5;
      --text-muted: #8e95a5;
      --border: #2a2f3d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Microsoft YaHei", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
      user-select: none;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
      position: relative;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-bars {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .lang-switcher {
      display: flex;
      gap: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 4px;
      border-radius: 20px;
      align-items: center;
    }

    

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn:hover {
      color: var(--text);
    }

    .lang-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(224, 67, 107, 0.4);
    }

    

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
      transition: color 0.3s ease;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 900px;
      width: 100%;
    }

    .stage-container {
      position: relative;
      width: 100%;
      height: 380px;
      background: radial-gradient(circle at center, #351b2e 0%, #140d1a 100%);
      border: 1px solid #701a75;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 40px;
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    .stage-container.classic-theme {
      background: radial-gradient(circle at center, #242938 0%, #171a23 100%);
      border-color: var(--border);
    }

    .floor {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: #141720;
      border-top: 1px solid var(--border);
    }

    #pet {
      position: absolute;
      width: 192px;
      height: 208px;
      background-image: url('pet/outfits/default/spritesheet.webp');
      background-repeat: no-repeat;
      background-size: 1536px 1872px;
      cursor: grab;
      bottom: 40px;
      left: calc(50% - 96px);
      transition: transform 0.05s ease;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.45));
    }

    #pet:active {
      cursor: grabbing;
    }

    .speech-bubble {
      position: absolute;
      bottom: 250px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      color: #1a1a1a;
      padding: 10px 18px;
      border-radius: 18px;
      font-weight: 600;
      font-size: 0.9rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      white-space: pre-line;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      z-index: 10;
      max-width: 340px;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: #ffffff transparent;
      display: block;
      width: 0;
    }

    .speech-bubble.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-10px);
    }

    .controls-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 24px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .state-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    button.btn {
      background: #252a37;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button.btn:hover {
      background: #313747;
      border-color: var(--accent);
    }

    button.btn.active {
      background: var(--accent);
      border-color: var(--accent-hover);
      color: #fff;
      box-shadow: 0 0 12px rgba(224, 67, 107, 0.4);
    }

    button.btn-special {
      background: linear-gradient(135deg, #701a75, #be123c);
      border-color: #f43f5e;
      color: #fff;
      box-shadow: 0 2px 10px rgba(244, 63, 94, 0.3);
    }
    button.btn-special:hover {
      background: linear-gradient(135deg, #86198f, #e11d48);
      box-shadow: 0 2px 14px rgba(244, 63, 94, 0.5);
    }

    button.btn-bday {
      background: #382436;
      border-color: #d946ef;
      color: #fbcfe8;
    }
    button.btn-bday:hover {
      background: #4a2d48;
      border-color: #f472b6;
    }

    .sliders-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    input[type="range"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .guide-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
      width: 100%;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .guide-card h2 {
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .guide-card ul {
      margin-left: 20px;
      color: var(--text-muted);
    }

    .guide-card li {
      margin-bottom: 6px;
    }

    .guide-card code {
      background: #12141a;
      padding: 2px 6px;
      border-radius: 4px;
      color: #ffd166;
      font-family: monospace;
    }
  </style>
</head>

          if (s.lang && I18N_DATA[s.lang]) currentLang = s.lang;
          if (s.scale) {
            scaleMultiplier = parseFloat(s.scale);
            const slider = document.getElementById('scaleSlider');
            if (slider) slider.value = scaleMultiplier;
            setScale(scaleMultiplier, false);
          }
          if (s.speed) {
            speedMultiplier = parseFloat(s.speed);
            const speedSlider = document.getElementById('speedSlider');
            if (speedSlider) speedSlider.value = speedMultiplier;
            setSpeed(speedMultiplier, false);
          }
          if (s.wander !== undefined) {
            isWandering = s.wander;
            const wToggle = document.getElementById('wanderToggle');
            if (wToggle) wToggle.checked = isWandering;
          }
        }
      } catch (e) {}
    }

    function saveSettings() {
      try {
        const data = {
          lang: currentLang,
          scale: scaleMultiplier,
          speed: speedMultiplier,
          wander: isWandering
        };
        localStorage.setItem('kikuri_desktop_pet_settings', JSON.stringify(data));
      } catch (e) {}
    }

    

        function playLaunchGreeting() {
      setState('jumping');
      const data = I18N_DATA[currentLang];
      const classicQuotes = {
        'jp': "がはは！今日も元気にロックでいこう！🍶✨",
        'cn': "嘎哈哈！今天也要加油干活、全力摇滚哦！🍶✨",
        'en': "Gahaha! Let's rock hard and have a great day! 🍶✨"
      };
      showQuote(classicQuotes[currentLang] || data.quotes[0]);
      setTimeout(() => setState('waving'), 2000);
      setTimeout(() => setState('idle'), 4200);
    }
    }

    

    function updateHeaderTitle() {
      const data = I18N_DATA[currentLang];
      document.getElementById('ui-title').textContent = data.title;
    }

    function setLang(lang, shouldSave = true) {
      if (!I18N_DATA[lang]) return;
      currentLang = lang;

      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      const activeLangBtn = document.getElementById(`btn-lang-${lang}`);
      if (activeLangBtn) activeLangBtn.classList.add('active');

      const data = I18N_DATA[lang];
      updateHeaderTitle();
      document.getElementById('ui-subtitle').textContent = data.subtitle;
      document.getElementById('ui-roam').textContent = data.roam;
      document.getElementById('ui-scale').textContent = data.scale;
      document.getElementById('ui-speed').textContent = data.speed;
      document.getElementById('ui-guide').innerHTML = data.guide_html;

      for (const [key, label] of Object.entries(data.states)) {
        const btn = document.getElementById(`btn-${key}`);
        if (btn) btn.textContent = label;
      }

      if (shouldSave) saveSettings();
    }

    function updateFrame() {
      const config = ROWS[currentState];
      const posX = -(currentFrame * CELL_W);
      const posY = -(config.row * CELL_H);
      pet.style.backgroundPosition = `${posX}px ${posY}px`;

      const duration = (config.durations[currentFrame] || 250) / speedMultiplier;
      currentFrame = (currentFrame + 1) % config.frames;
      animTimer = setTimeout(updateFrame, duration);
    }

    function setState(stateName) {
      if (!ROWS[stateName]) return;
      currentState = stateName;
      currentFrame = 0;
      clearTimeout(animTimer);

      document.querySelectorAll('.state-buttons .btn').forEach(btn => {
        if (btn.id === `btn-${stateName}`) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      updateFrame();
    }

    function showQuote(text) {
      const data = I18N_DATA[currentLang];
      const list = data.quotes;
      bubble.textContent = text || list[Math.floor(Math.random() * list.length)];
      bubble.classList.add('show');
      setTimeout(() => bubble.classList.remove('show'), 3800);
    }

    function triggerBirthday() {
      setState('jumping');
      showQuote(I18N_DATA[currentLang].bday_msg);
      setTimeout(() => setState('waving'), 2800);
    }

    function setSpeed(val, shouldSave = true) {
      speedMultiplier = parseFloat(val);
      document.getElementById('speedVal').textContent = `${speedMultiplier.toFixed(1)}x`;
      if (shouldSave) saveSettings();
    }

    function setScale(val, shouldSave = true) {
      scaleMultiplier = parseFloat(val);
      document.getElementById('scaleVal').textContent = `${scaleMultiplier.toFixed(1)}x`;
      pet.style.transform = `scale(${scaleMultiplier})`;
      if (shouldSave) saveSettings();
    }

    // Drag & Drop
    let isDragging = false;
    let dragStartX = 0;
    let petStartX = 0;

    function checkBirthdayEvent() {
      const now = new Date();
      if (now.getMonth() === 7 && now.getDate() === 15) { // August 15 (month 7 is 0-indexed)
        setTimeout(triggerBirthday, 2000);
      }
    }

    pet.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStartX = e.clientX;
      petStartX = pet.offsetLeft;
      const now = new Date();
      if (now.getMonth() === 7 && now.getDate() === 15) {
        triggerBirthday();
      } else {
        showQuote();
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const newX = Math.max(10, Math.min(stage.clientWidth - CELL_W - 10, petStartX + dx));
      pet.style.left = `${newX}px`;
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) isDragging = false;
    });

    // Roam Mode
    function toggleWander(enabled) {
      isWandering = enabled;
      saveSettings();
      if (isWandering) {
        wanderLoop();
      } else {
        clearTimeout(wanderTimer);
        setState('idle');
      }
    }

    function wanderLoop() {
      if (!isWandering) return;
      const currentX = pet.offsetLeft;
      const maxX = stage.clientWidth - CELL_W - 20;
      const nextX = Math.floor(Math.random() * maxX) + 10;
      const dist = nextX - currentX;

      if (Math.abs(dist) < 40) {
        const actions = ['waving', 'jumping', 'idle', 'running'];
        const act = actions[Math.floor(Math.random() * actions.length)];
        setState(act);
        if (Math.random() > 0.6) showQuote();
        wanderTimer = setTimeout(wanderLoop, 3500);
        return;
      }

      if (dist > 0) {
        setState('running-right');
      } else {
        setState('running-left');
      }

      const step = dist > 0 ? 0.45 : -0.45;
      let walkSteps = Math.abs(dist) / 0.45;

      function stepWalk() {
        if (!isWandering || walkSteps <= 0) {
          setState('idle');
          wanderTimer = setTimeout(wanderLoop, 3000);
          return;
        }
        const maxStageX = Math.max(10, stage.clientWidth - CELL_W - 10);
        const curX = pet.offsetLeft + step;
        pet.style.left = `${Math.max(10, Math.min(maxStageX, curX))}px`;
        walkSteps--;
        requestAnimationFrame(stepWalk);
      }
      stepWalk();
    }

    // Initialize with saved or default settings
    loadSavedSettings();
    setLang(currentLang, false);
    
    setState('idle');
    setTimeout(playLaunchGreeting, 600);
    checkBirthdayEvent();
  </script>
</body>
</html>
